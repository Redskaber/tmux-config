# @path: ~/.config/tmux/tmux.conf
# @base: Zsh / Fish + Starship
# @philosophy: Do One Thing Well — Tmux manages sessions; `tx` manages organization.
# @author: redskaber
#
# This config wires together three layers:
#   1. Core tmux settings (ergonomics, navigation, copy mode)
#   2. Policy-driven capability resolvers (clipboard / keymaps / layouts)
#   3. `tx` — the window-organization manager (snapshot · group · restore)

# ==========================
# ===  General settings  ===
# ==========================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -g history-limit 50000
set -sg escape-time 0
set -g display-time 1500
set -g mouse on
set -g focus-events on

# Prefix: Ctrl-a (screen-compatible)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Index windows/panes from 1 (ergonomic — matches keyboard row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g aggressive-resize on

# Keep window names stable (Starship / manual naming)
setw -g automatic-rename off
setw -g allow-rename off

set -g set-titles on
set -g set-titles-string "#T"

# OSC 52 clipboard (WezTerm / Kitty / iTerm)
set -g set-clipboard on
set -gq allow-passthrough on
set -g visual-activity off

# Ensure `tx` is reachable from run-shell / popup shells.
# tmux's run-shell / display-popup inherit tmux's environment, which may NOT
# include ~/.local/bin. Resolve TX_HOME (config dir) and prepend its bin/ to
# PATH so `tx` works everywhere — robust against symlinks and custom installs.
if-shell 'command -v tx >/dev/null 2>&1 || [ -x "$HOME/.config/tmux/bin/tx" ]' \
  'set-environment -g TX_HOME "$HOME/.config/tmux"; set-environment -g PATH "$HOME/.config/tmux/bin:${PATH}"'

# ==========================
# ===   Key bindings     ===
# ==========================

# Reload config (ASCII ~ for portability)
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# New window / splits keep current path
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Pane navigation (Vim-style, prefixed + meta)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-Tab   last-window

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Kill / zoom / detach / status toggle
bind x kill-pane
bind X kill-window
bind + resize-pane -Z
bind d detach-client
bind C-s if -F '#{==:#{status},on}' 'set status off' 'set status on'

# ==========================
# ===  tx integration    ===
# ==========================
# Window-organization manager (snapshot · group · restore · start).
# Uses `tx` (resolved on PATH by the environment bootstrap above).

# prefix S       → save current session(s) as a named snapshot (popup)
bind S display-popup -E -w 70% -h 50% -B -b rounded \
  "tx save"

# prefix O       → interactive picker: select a snapshot to restore (popup)
bind O display-popup -E -w 85% -h 75% -B -b rounded \
  "tx"

# prefix M-s     → list snapshots (popup)
bind M-s display-popup -E -w 85% -h 60% -B -b rounded \
  "tx ls; read -rp 'Press Enter to close...' _"

# prefix C-o     → quick save (auto-name) of the current session (background)
bind C-o run-shell -b "tx save -y >/tmp/tx-save.log 2>&1"

# prefix C-t     → restore the most-recent snapshot (one-key "resume work")
bind C-t run-shell -b "tx last --replace --attach 2>&1 | tmux load-buffer -; tmux display-buffer 2>/dev/null || true"

# ==========================
# === Keymap / Helper    ===
# ==========================

# prefix ?    → tmux native list-keys (preserved; shows ALL tmux bindings)
# prefix /    → tx keymap cheat-sheet (fzf popup, friendly categorized view)
bind / display-popup -E -w 75% -h 80% "~/.config/tmux/scripts/tmux-keymaps.sh"
bind L run-shell "~/.config/tmux/scripts/tmux-layouts.sh"

# ================================
# === Copy mode & Clipboard    ===
# ================================

setw -g mode-keys vi

bind -n M-Up copy-mode
bind -T copy-mode-vi M-Up      send-keys -X scroll-up
bind -T copy-mode-vi M-Down    send-keys -X scroll-down
bind -T copy-mode-vi PageUp    send-keys -X page-up
bind -T copy-mode-vi PageDown  send-keys -X page-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/tmux-clipboard.sh"
bind p paste-buffer

# ==============================
# === Nested tmux support    ===
# ==============================

bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#a0a0a0,bg=#313244" \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# ==============================
# === Status bar (refined)   ===
# ==============================

set -g status-position top
set -g status-interval 10
set -g status-style "fg=#cdd6f4,bg=default"

# Left: session name + snapshot count if any
set -g status-left "#[fg=#89b4fa,bold,bg=default] #S "
set -g status-left-length 32

# Right: clock + host
set -g status-right "#[fg=#89b4fa,bold,bg=default]%H:%M "
set -g status-right-length 32

setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g window-status-current-format "#[fg=#89b4fa,bg=#1e1e2e,bold]#I:#W(#[fg=#89b4fa,bg=#1e1e2e,nobold]#{b:pane_current_path}#[fg=#89b4fa,bg=#1e1e2e,bold])"
setw -g window-status-style "fg=#7f849c,bg=default"
setw -g window-status-format " #I:#W "

setw -g pane-active-border-style "fg=#585b70"
setw -g pane-border-style "fg=#313244"
set -g clock-mode-colour "#89b4fa"
